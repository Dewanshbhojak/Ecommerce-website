spring.application.name=Ecommerce_Backend

# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}

# ===============================
# CORS
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===============================
# MYSQL DATASOURCE
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vibe_db}?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# HIKARICP CONNECTION POOL
# ===============================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000

# ===============================
# RAZORPAY
# ===============================
razorpay.key_id=${RAZORPAY_KEY_ID:}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:}

# ===============================
# BREVO EMAIL API
# ===============================
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:Vibe Luxe Concierge Team}

# ===============================
# JWT & APP CONFIG
# ===============================
jwt.secret=${JWT_SECRET:vibe_luxe_default_jwt_secret_key_that_is_at_least_32_bytes_long}
app.seed-data=${SEED_DATA:false}
app.cookie.secure=${COOKIE_SECURE:false}
