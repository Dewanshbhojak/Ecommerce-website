spring.application.name=Ecommerce_Backend
server.port=${PORT:8080}

# ===============================
# CORS
# ===============================
cors.allowed-origins=http://localhost:5173,https://YOUR-VERCEL-APP.vercel.app

# ===============================
# MYSQL
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:YOUR_RAILWAY_PUBLIC_HOST}:${MYSQLPORT:YOUR_RAILWAY_PUBLIC_PORT}/${MYSQLDATABASE:railway}?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:YOUR_RAILWAY_MYSQL_PASSWORD}}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# RAZORPAY
# ===============================
razorpay.key_id=YOUR_RAZORPAY_KEY_ID
razorpay.key_secret=YOUR_RAZORPAY_KEY_SECRET

# ===============================
# MAIL
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL_ADDRESS
spring.mail.password=YOUR_GMAIL_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# JWT
# ===============================
jwt.secret=YOUR_SECURE_JWT_SECRET
app.seed-data=${SEED_DATA:false}
app.cookie.secure=${COOKIE_SECURE:false}
