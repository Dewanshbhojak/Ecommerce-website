spring.application.name=Ecommerce_Backend
server.port=${PORT:8080}

# ===============================
# CORS
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://YOUR-VERCEL-APP.vercel.app}

# ===============================
# MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# RAZORPAY
# ===============================
razorpay.key_id=${RAZORPAY_KEY_ID:}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:}

# ===============================
# BREVO EMAIL API
# ===============================
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:Vibe Luxe Concierge Team}

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
app.seed-data=${SEED_DATA:false}
app.cookie.secure=${COOKIE_SECURE:false}
